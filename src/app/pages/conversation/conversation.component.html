<div class="layout-wrapper">
  <header class="header">
    <div class="plan-status">
      <!--Free plan • <a href="#" class="upgrade-link">Update</a>-->
      Free plan
    </div>
  </header>

  <main class="main-content">
    <!-- Panel Greetings -->
    <div class="greeting-container">
      <span class="sparkle">✦</span>
      <h1 class="user-greeting">{{ greeting }}</h1>
    </div>
    
    <!-- Panel files Selected -->
    <div *ngIf="showFilterTagsPanel"
        class="input-filter-tags"
        style="border-radius: 20px; overflow-x: hidden; overflow-y: auto; border: 1px solid #e0e0e0;">
        <p-table #dtFiles
            [value]="files" 
            [(selection)]="selectedFiles"
            [tableStyle]="{ 'width': '840px' }"
            [globalFilterFields]="['collection', 'name', 'tags_str']"
            [scrollable]="true"
            scrollHeight="150px">
            <ng-template #caption>
                <div class="flex align-items-center justify-content-between px-2">
                    <p-iconfield>
                        <p-inputicon class="pi pi-search" />
                        <input type="text" pInputText placeholder="Search" (input)="dtFiles.filterGlobal($any($event.target).value, 'contains')" />
                    </p-iconfield>
                    <p-button
                        icon="pi pi-times"
                        [rounded]="true"
                        [text]="true"
                        severity="secondary"
                        (onClick)="onSelectTags()" />
                </div>        
            </ng-template>                
            <ng-template #header>
                <tr>
                    <th style="width: 4rem">
                        <p-tableHeaderCheckbox />
                    </th>                        
                    <th>Collection</th>
                    <th>Name</th>
                    <th>Tags</th>
                </tr>
            </ng-template>
            <ng-template #body let-file>
                <tr>
                    <td>
                        <p-tableCheckbox [value]="file" />
                    </td>
                    <td>{{ file.collection }}</td>
                    <td>{{ file.name }}</td>
                    <td class="file-tags-cell">
                        @for (tag of file.tags; track $index) {
                            <span class="size-badge">{{ tag.trim() }}</span>
                        }
                    </td>                        
                    <td style="display: none">{{ file.tags_str }}</td>
                </tr>
            </ng-template>
        </p-table>  
    </div>  
    
    <!-- Panel Tags Selected -->
    <div *ngIf="showTagsPanel" class="input-filter-tags"
        style="display: flex; gap: 1; flex-direction: row; align-items: center; justify-content: space-between; border-radius: 20px; border: 1px solid #e0e0e0;">
        <p-autocomplete [(ngModel)]="tagsSelected" [multiple]="true" [suggestions]="suggestions" [showEmptyMessage]="false"
            style="width: 100%;" />
        <p-button label="Clear" size="small" severity="secondary" (onClick)="onClearTags()" />
    </div>

    <!-- Panel Prompt -->
    <div class="prompt-card p-shadow-1">
      <textarea
        #chatTextarea
        class="prompt-input"
        pInputTextarea
        autoResize="true"
        rows="1"  
        placeholder="How can I help you today?"
        [(ngModel)]="message"
        (keydown)="onHandleKeyDown($event, chatTextarea)"
        (input)="onAutoGrow(chatTextarea)">
      </textarea>
      
      <div class="prompt-footer">
        <div style="display: flex; flex-direction: row;">
            <div class="flex align-items-center gap-2">
                <p-button 
                    icon="pi pi-plus" 
                    [text]="true" 
                    [rounded]="true"
                    severity="secondary"
                    (onClick)="menu.toggle($event)">
                </p-button>
                <!-- Floating Menu Panel -->
                <p-menu 
                    #menu 
                    styleClass="filter-tags-menu"
                    [model]="menuFilterTagsItems" 
                    [popup]="true"
                    appendTo="body">
                </p-menu>                            
            </div>
            <div class="flex align-items-center gap-2">
                <span for="ragToggle" class="text-sm text-gray-500 font-normal">Knowledge Base</span>
                <p-toggleswitch 
                    inputId="ragToggle"
                    [(ngModel)]="activeRAG"
                />
            </div>
        </div>        
        <!--<div class="flex items-center gap-2">
            <label for="ragToggle" class="text-sm text-gray-500 font-normal" style="padding-top: 3px;">Knowledge Base </label>
            <p-toggleswitch 
                inputId="ragToggle"
                [(ngModel)]="activeRAG"
            />
        </div>-->        
        
        <div class="model-selector">
          <!--<span class="model-name">Sonnet 4.6</span>-->
          <!--<i class="pi pi-chevron-down" style="font-size: 0.7rem"></i>-->
          <p-button 
            #messageButton
            (onClick)="sendChat($event, messageButton.el.nativeElement)" 
            [icon]="'pi pi-send'"
            [style]="{'color': '#000000', 'border': 'none'}"
            [text]="true"
            [severity]="'primary'"
            [disabled]="!message || !message.trim()">
          </p-button>                    
        </div>
      </div>
    </div>

    <div class="footer-action">
      <!--<p-button 
        label="VeraDoc Selection" 
        icon="pi pi-lightbulb" 
        [outlined]="true" 
        severity="secondary" 
        styleClass="p-button-rounded selection-btn">
      </p-button>-->
    </div>
  </main>
</div>
